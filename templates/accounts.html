{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Accounts</h2>
    <div class="d-flex gap-2">
        <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#transferModal"><i class="bi bi-arrow-left-right me-1"></i>Transfer</button>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#accountModal"><i class="bi bi-plus-lg me-1"></i>Add Account</button>
    </div>
</div>

<div class="row mb-4" id="accountsContainer">
    <!-- Populated via JS -->
</div>

<h4>Recent Transfers</h4>
<div class="card shadow-sm mb-4">
    <table class="table table-hover mb-0">
        <thead class="table-light"><tr><th>Date</th><th>From</th><th>To</th><th>Amount (₹)</th><th>Description</th></tr></thead>
        <tbody id="transfersTableBody"></tbody>
    </table>
</div>

<!-- Account Modal -->
<div class="modal fade" id="accountModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="accountForm" onsubmit="saveAccount(event)">
                <div class="modal-header"><h5 class="modal-title">Add Account</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-3"><label>Account Name</label><input type="text" id="accName" class="form-control" required></div>
                    <div class="mb-3"><label>Type</label><select id="accType" class="form-select"><option>Bank</option><option>Wallet</option><option>Cash</option><option>Credit Card</option></select></div>
                    <div class="mb-3"><label>Initial Balance (₹)</label><input type="number" id="accBalance" class="form-control" step="0.01" required></div>
                    <div class="mb-3"><label>Color Accent</label><input type="color" id="accColor" class="form-control form-control-color"></div>
                </div>
                <div class="modal-footer"><button type="submit" class="btn btn-primary">Save</button></div>
            </form>
        </div>
    </div>
</div>

<!-- Transfer Modal -->
<div class="modal fade" id="transferModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="transferForm" onsubmit="saveTransfer(event)">
                <div class="modal-header"><h5 class="modal-title">Transfer Funds</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-3"><label>From Account</label><select id="trFrom" class="form-select" required></select></div>
                    <div class="mb-3"><label>To Account</label><select id="trTo" class="form-select" required></select></div>
                    <div class="mb-3"><label>Amount (₹)</label><input type="number" id="trAmount" class="form-control" step="0.01" required></div>
                    <div class="mb-3"><label>Date</label><input type="date" id="trDate" class="form-control" required></div>
                    <div class="mb-3"><label>Description</label><input type="text" id="trDesc" class="form-control"></div>
                </div>
                <div class="modal-footer"><button type="submit" class="btn btn-primary">Transfer</button></div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadAccounts() {
        try {
            const res = await fetch('/api/accounts');
            if(res.ok) {
                const data = await res.json();
                const container = document.getElementById('accountsContainer');
                container.innerHTML = data.map(a => `
                    <div class="col-md-4 mb-3">
                        <div class="card shadow-sm h-100" style="border-left: 4px solid ${a.color || '#0d6efd'}">
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <h5 class="card-title"><i class="bi bi-bank me-2"></i>${a.name}</h5>
                                    <span class="badge bg-secondary">${a.type}</span>
                                </div>
                                <h3 class="mt-3 mb-0">₹${a.balance}</h3>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        } catch(e) { console.error(e); }
    }
    
    async function saveAccount(e) {
        e.preventDefault();
        const payload = {
            name: document.getElementById('accName').value, type: document.getElementById('accType').value,
            balance: document.getElementById('accBalance').value, color: document.getElementById('accColor').value
        };
        await fetch('/api/accounts', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        bootstrap.Modal.getInstance(document.getElementById('accountModal')).hide();
        loadAccounts(); showToast('Account added');
    }

    async function saveTransfer(e) {
        e.preventDefault();
        // Similar API call for transfer
        bootstrap.Modal.getInstance(document.getElementById('transferModal')).hide();
        showToast('Transfer completed');
    }

    document.addEventListener('DOMContentLoaded', loadAccounts);
</script>
{% endblock %}
