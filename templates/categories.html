{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Categories</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#categoryModal"><i class="bi bi-plus-lg me-1"></i>Add Category</button>
</div>

<div class="row" id="categoriesContainer">
    <!-- Populated via JS -->
</div>

<!-- Modal -->
<div class="modal fade" id="categoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form onsubmit="saveCategory(event)">
                <div class="modal-header"><h5 class="modal-title">Add Category</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-3"><label>Name</label><input type="text" class="form-control" required></div>
                    <div class="mb-3"><label>Icon (bi- class)</label><input type="text" class="form-control" placeholder="e.g. bi-cart" required></div>
                    <div class="mb-3"><label>Color</label><input type="color" class="form-control form-control-color" value="#0d6efd"></div>
                </div>
                <div class="modal-footer"><button type="submit" class="btn btn-primary">Save</button></div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadCategories() {
        try {
            const res = await fetch('/api/categories');
            if(res.ok) {
                const data = await res.json();
                document.getElementById('categoriesContainer').innerHTML = data.map(c => `
                    <div class="col-md-3 mb-3">
                        <div class="card shadow-sm">
                            <div class="card-body d-flex align-items-center">
                                <div class="rounded-circle text-white d-flex justify-content-center align-items-center me-3" style="width: 40px; height: 40px; background-color: ${c.color}">
                                    <i class="bi ${c.icon}"></i>
                                </div>
                                <div class="flex-grow-1">
                                    <h6 class="mb-0">${c.name} ${c.isCustom ? '<span class="badge bg-secondary ms-1">Custom</span>' : ''}</h6>
                                    <small class="text-muted">${c.count || 0} expenses</small>
                                </div>
                                ${c.isCustom ? `<button class="btn btn-sm btn-link text-danger p-0" onclick="deleteCategory(${c.id})"><i class="bi bi-trash"></i></button>` : ''}
                            </div>
                        </div>
                    </div>`).join('');
            }
        } catch(e){}
    }
    async function saveCategory(e) { e.preventDefault(); bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide(); showToast('Category added'); }
    function deleteCategory(id) { if(confirm('Delete?')) showToast('Deleted'); }
    document.addEventListener('DOMContentLoaded', loadCategories);
</script>
{% endblock %}
