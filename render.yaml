services:
  # ── Flask Backend ──────────────────────────────────────────────
  - type: web
    name: paymanagement-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false      # Supabase connection string
      - key: SUPABASE_URL
        sync: false      # Set in Render dashboard
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false      # Set in Render dashboard
      - key: SUPABASE_SECRET_KEY
        sync: false      # Set in Render dashboard
      - key: SUPABASE_JWKS_URL
        sync: false      # Set in Render dashboard
      - key: GROQ_API_KEY
        sync: false      # Set in Render dashboard
      - key: GOOGLE_API_KEY
        sync: false      # Set in Render dashboard
      - key: OPENROUTER_API_KEY
        sync: false      # Set in Render dashboard

  # ── React Frontend (static site) ──────────────────────────────
  - type: web
    name: paymanagement-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://paymanagement.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
